# Docker Compose for local development OUTSIDE Replit.
# (Replit does not run containers; there the services run via Replit workflows
# and the built-in PostgreSQL database.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modeem
      POSTGRES_PASSWORD: modeem
      POSTGRES_DB: modeem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modeem"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile

    # Load local server environment variables
    # .env stays outside Git and will not be modified by CI/CD
    env_file:
      - .env

    environment:
      ENVIRONMENT: development
      SESSION_SECRET: modeem-dev-secret-change-later
      DATABASE_URL: postgresql://modeem:modeem@postgres:5432/modeem
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  operations-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile

    env_file:
      - .env

    environment:
      ENVIRONMENT: development
      SESSION_SECRET: modeem-dev-secret-change-later
      DATABASE_URL: postgresql://modeem:modeem@postgres:5432/modeem
      REDIS_URL: redis://redis:6379/0

    command: python -m app.workers.operations
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile

    # Load local server environment variables
    # .env stays outside Git and will not be modified by CI/CD
    env_file:
      - .env

    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      SESSION_SECRET: modeem-dev-secret-change-later

    ports:
      - "3000:3000"

    depends_on:
      - api

volumes:
  postgres_data:
